name: AETHER Software and Firmware Validation
on:
  push:
    branches: [main, aether-x01-smartphone-4sonar]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    name: Python host-mocked tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Host-mocked Python tests
        run: python -m pytest -v
  stm32:
    name: STM32 HAL build and native host-mocked tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build STM32F303RE target (compile-only)
        working-directory: firmware/stm32
        run: pio run -e nucleo_f303re
      - name: Host-mocked Unity native tests
        working-directory: firmware/stm32
        run: pio test -e native
