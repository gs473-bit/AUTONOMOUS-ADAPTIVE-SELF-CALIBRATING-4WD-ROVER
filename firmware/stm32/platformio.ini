; NUCLEO-F303RE from user's photographed MB1136 board; never deploy to F411 BlackPill.
[platformio]
default_envs = nucleo_f303re

[env:nucleo_f303re]
platform = ststm32
board = nucleo_f303re
framework = stm32cube
upload_protocol = stlink
build_flags =
  -std=gnu11
  -Wall
  -Wextra
  -Werror
  -DAETHER_TARGET_F303RE=1
  -Iinclude
  -Isrc
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
  -std=gnu11
  -Wall
  -Wextra
  -Werror
  -Iinclude
  -Isrc
