; AETHER X01 NUCLEO-F303RE; production outputs DISABLED until validated
[platformio]
default_envs = nucleo_f303re
[env:nucleo_f303re]
platform = ststm32
board = nucleo_f303re
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -std=gnu11
    -Wall
    -Wextra
    -Werror
    -Wno-unused-parameter ; HAL_EXTI has unused Edge params under -Wextra
    -Iinclude
    -Isrc
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -std=gnu11
    -Wall
    -Wextra
    -Werror
    -Iinclude
    -Isrc
