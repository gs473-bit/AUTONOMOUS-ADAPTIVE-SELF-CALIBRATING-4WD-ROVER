; AETHER X01. Firmware remains DISARMED until pins, limits and hardware tests are verified.
[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
build_flags =
    -std=gnu11
    -Wall
    -Wextra
    -Werror
    -DAETHER_TARGET_F411CE=1
upload_protocol = stlink
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -std=gnu11
    -Wall
    -Wextra
    -Werror
    -Iinclude
    -Isrc
